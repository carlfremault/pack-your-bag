services:
  postgres_db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-run:/var/run/postgresql
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - app-network

  dev-container:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/workspaces/pack-your-bag:cached
      - pack-your-bag-cache:/home/node/.cache/yarn
    networks:
      - app-network
    init: true
    command: sleep infinity
    depends_on:
      - postgres_db
      - mailpit

networks:
  app-network:
    driver: bridge

volumes:
  pack-your-bag-cache:
    name: pack-your-bag-cache
  pack-your-bag-node-modules-v24:
    name: pack-your-bag-node-modules-v24
  pack-your-bag-extensions-v24:
    name: pack-your-bag-extensions-v24
  postgres-data:
    name: postgres-data
  postgres-run:
    name: postgres-run
