services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env.postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:8
    restart: unless-stopped
    env_file: .env.mongo
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-migrate:
    image: ghcr.io/carlfremault/pack-your-bag/db-migrate:latest
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    env_file: .env.db-migrate
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate
    restart: 'no'

  auth-service:
    image: ghcr.io/carlfremault/pack-your-bag/auth-service:latest
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    env_file: .env.auth-service
    environment:
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  product-service:
    image: ghcr.io/carlfremault/pack-your-bag/product-service:latest
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    restart: unless-stopped
    env_file: .env.product-service
    environment:
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8002/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  user-data-service:
    image: ghcr.io/carlfremault/pack-your-bag/user-data-service:latest
    build:
      context: .
      dockerfile: apps/user-data-service/Dockerfile
    restart: unless-stopped
    env_file: .env.user-data-service
    environment:
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - internal
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8003/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/carlfremault/pack-your-bag/web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
        SENTRY_RELEASE: ${SENTRY_RELEASE}
    restart: unless-stopped
    env_file: .env.web
    networks:
      - internal
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-data-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/login || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      web:
        condition: service_healthy

  # ── Monitoring ───────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - internal
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.packyourbag.me
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - internal
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    env_file: .env.postgres-exporter
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  uptime-kuma-data:
